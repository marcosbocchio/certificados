version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: rusoft-certificados:dev
    container_name: rusoft-certificados
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      # El .env del repo manda. Esto solo se aplica si Laravel no encuentra una variable allí.
      APACHE_RUN_USER: "#1000"
      APACHE_RUN_GROUP: "#1000"
    extra_hosts:
      # Asegura que host.docker.internal apunte al host en Linux también
      - "host.docker.internal:host-gateway"
